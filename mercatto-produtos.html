<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Mercatto — Sistema de Vendas</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"

<body class="p-20">

    <nav class="menu-lateral col" id="menu-lateral-nav">
        <div class="c-logo">
            <div class="logo-icon">
                <svg width="26" height="26" viewBox="0 0 46 46" fill="none">
                    <path d="M 7 16 Q 23 8 39 16" stroke="rgba(255,255,255,0.55)" stroke-width="2" fill="none"
                        stroke-linecap="round" />
                    <rect x="7" y="19" width="5.5" height="18" rx="1.5" fill="white" />
                    <rect x="33.5" y="19" width="5.5" height="18" rx="1.5" fill="white" />
                    <path d="M 7 19 L 23 30 L 23 37 L 7 27 Z" fill="white" />
                    <path d="M 39 19 L 23 30 L 23 37 L 39 27 Z" fill="white" />
                    <circle cx="23" cy="34" r="3" fill="#FF6B35" />
                    <circle cx="23" cy="34" r="1.5" fill="white" opacity="0.9" />
                </svg>
            </div>
        </div>


        <div class="options">
            <div class="option-menu row g-10">
                <a class="full-w" href="mercatto-home.html"><span>Dashboard</span></a>
            </div>
            <div class="option-menu row g-10">
                <a class="full-w" href="mercatto-clientes.html"><span>Clientes</span></a>
            </div>
            <div class="option-menu row g-10">
                <a class="full-w" href="mercatto-funcionarios.html"><span>Funcionários</span></a>
            </div>
            <div class="option-menu row g-10">
                <a class="full-w" href="mercatto-produtos.html"><span>Produtos</span></a>
            </div>
            <div class="option-menu row g-10">
                <a class="full-w" href="mercatto-vendas.html"><span>Vendas</span></a>
            </div>
        </div>
    </nav>


    <div class="row" style="align-items:center; justify-content: flex-start;">
        <div class="toggle-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="header-page g-10 col  margin-bottom-s">
            <h1 class="title">Produtos</h1>
            <h1 class="subtitle">Gerencie os produtos e estoque do seu negócio.</h1>
        </div>
    </div>



    <div class="row f-right" style="width: 100% !important;">
        <a href="mercatto-produtos-editar.html" class="btn-m margin-bottom-s">Adicionar Produto</a>

    </div>

     <div class="barra-pesquisa margin-bottom-s al-center row g-10 space-bet" style="align-items: center;">
        <div class="c-input al-center  full-w col" style="align-items: center;"> 
           <!-- Ao digitar, exibe o botão de limpar filtros (x) e ao clicar, limpa o campo de busca e recarrega a página -->
            
          <input id="Search" type="text" oninput="toggleLimparFiltros()" placeholder="Buscar produtos...">
           
        </div>
            <a id="limparfiltros" class="hide" href="mercatto-produtos.html"><i class="fa fa-remove"></i></a>
            <button class="btn-m" type="button" onclick="BuscarConteudo('Search','lista-produtos','.table-1','Nenhum produto encontrado.')">Buscar</button>
    </div>



    <div class="col ConteudoBusca p-20" id="lista-produtos" style="width: 100%; height: 100%; align-items: center;">
        <div class="tabela-container" style="width: 100%;">
            <table class="table-1" style="width: 100%;">
                <thead>
                    <tr>
                        <th class="al-center hide">ID</th>
                        <th class="al-left">Categoria</th>
                        <th class="al-left">Fornecedor</th>
                        <th class="al-left">Nome</th>
                        <th class="al-left">Preço</th>
                        <th class="al-right">Estoque</th>
                        <th class="al-right">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos">

                </tbody>
            </table>
        </div>
    </div>
